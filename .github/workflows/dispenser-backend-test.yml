
name: Dispenser Backend Tests

on:
  push:
    branches:
      - main
      - dev
      - dev_v2
    paths:
      - 'backend/**'
  pull_request:
    branches:
      - main
      - dev
      - dev_v2
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Create .env file
        run: |
          cat <<EOF > distributeur/backend/.env
          APP_DB_HOST=${{ secrets.APP_DB_HOST }}
          APP_DB_USER=${{ secrets.APP_DB_USER }}
          APP_DB_PASSWORD=${{ secrets.APP_DB_PASSWORD }}
          APP_DB_NAME=${{ secrets.APP_DB_NAME }}
          DOCTORS_DB_HOST=${{ secrets.DOCTORS_DB_HOST }}
          DOCTORS_DB_USER=${{ secrets.DOCTORS_DB_USER }}
          DOCTORS_DB_PASSWORD=${{ secrets.DOCTORS_DB_PASSWORD }}
          DOCTORS_DB_NAME=${{ secrets.DOCTORS_DB_NAME }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          OPENROUTESERVICE_API_KEY=${{ secrets.OPENROUTESERVICE_API_KEY }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          IPHUB_API_KEY=${{ secrets.IPHUB_API_KEY }}
          IPHUNTER_API_KEY=${{ secrets.IPHUNTER_API_KEY }}
          ABUSEIPDB_API_KEY=${{ secrets.ABUSEIPDB_API_KEY }}
          GETIPINTEL_CONTACT=${{ secrets.GETIPINTEL_CONTACT }}
          SECRET_QR_ENCRYPTION_KEY=${{ secrets.SECRET_QR_ENCRYPTION_KEY }}

          EOF

      - name: Install build tools and dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install --upgrade "numpy==1.26.4" --only-binary=:all:
          pip install -r backend/requirements.txt --no-deps

      - name: Create fake database dump for CI
        if: env.CI == 'true'
        run: |
          cat <<EOF > backend/temp_fake_database_dump_px.sql
          -- App DB
          CREATE DATABASE IF NOT EXISTS \`${{ secrets.APP_DB_NAME }}\`;
          USE \`${{ secrets.APP_DB_NAME }}\`;
          CREATE USER IF NOT EXISTS '${{ secrets.APP_DB_USER }}'@'%' IDENTIFIED BY '${{ secrets.APP_DB_PASSWORD }}';
          GRANT ALL PRIVILEGES ON \`${{ secrets.APP_DB_NAME }}\`.* TO '${{ secrets.APP_DB_USER }}'@'%';
          FLUSH PRIVILEGES;
          -- Doctors DB
          CREATE DATABASE IF NOT EXISTS \`${{ secrets.DOCTORS_DB_NAME }}\`;
          USE \`${{ secrets.DOCTORS_DB_NAME }}\`;
          CREATE USER IF NOT EXISTS '${{ secrets.DOCTORS_DB_USER }}'@'%' IDENTIFIED BY '${{ secrets.DOCTORS_DB_PASSWORD }}';
          GRANT ALL PRIVILEGES ON \`${{ secrets.DOCTORS_DB_NAME }}\`.* TO '${{ secrets.DOCTORS_DB_USER }}'@'%';
          FLUSH PRIVILEGES;
          EOF
          cat backend/db/database.sql >> backend/temp_fake_database_dump_px.sql

      - name: Replace DB_NAME placeholder in SQL
        if: env.CI == 'true'
        run: |
          sed -i "s/__DB_NAME__/${{ secrets.DOCTORS_DB_NAME }}/g" backend/temp_fake_database_dump_px.sql

      - name: Run backend tests
        working-directory: .
        run: |
          python3 launch.py --verif
          python3 launch.py --back
          python3 launch.py --test

      - name: Show backend container logs on failure
        if: failure()
        run: docker logs distributeur-backend-app || true
