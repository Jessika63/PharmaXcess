
services:
  react-app:
    build:
      context: .
      args:
        - DEFAULT_LOCATION=${DEFAULT_LOCATION:-paris}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    container_name: "distributeur-frontend-app"