services:
  # ----------------------------
  # Backend Flask app container
  # ----------------------------
  app:
    image: phx-backend-app  # Name of the Docker image for the backend
    build:
      context: .             # Build context: current directory
      dockerfile: docker/Dockerfile.app  # Dockerfile to use for building the app image
    ports:
      - "5000:5000"  # Expose container port 5000 to host port 5000
    volumes:
      - .:/app        # Mount current directory to /app inside the container for live code changes
      - medicine_data:/data  # Persist medicine data in a Docker volume
    environment:
      - FLASK_ENV=development        # Flask environment
      - APP_DB_HOST=app-backend-db   # Host for application DB
      - APP_DB_USER=${APP_DB_USER}   # User for app DB (from .env)
      - APP_DB_PASSWORD=${APP_DB_PASSWORD} # Password for app DB (from .env)
      - APP_DB_NAME=${APP_DB_NAME}   # Database name for app DB (from .env)
      - DEFAULT_LOCATION=${DEFAULT_LOCATION:-paris}  # Default location for maps (from launch script, defaults to paris)
    container_name: "distributeur-backend-app"  # Explicit container name for backend app

  # ----------------------------
  # MySQL container for application DB
  # ----------------------------
  app-db:
    image: mysql/mysql-server:5.7  # MySQL 5.7 image
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}  # Root password for MySQL (from .env)
      MYSQL_DATABASE: ${APP_DB_NAME}               # Database to initialize for app
      MYSQL_EVENT_SCHEDULER: 'ON'
    ports:
      - "3308:3306"  # Map container port 3306 to host port 3308 to avoid conflict
    container_name: "app-backend-db"  # Container name for app DB
    volumes:
      - ./sql/app:/docker-entrypoint-initdb.d:ro  # SQL scripts to initialize DB (read-only)

  # ----------------------------
  # MySQL container for doctors / distributeur DB
  # ----------------------------
  distributeur-db:
    image: mysql/mysql-server:5.7  # MySQL 5.7 image
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}  # Root password for MySQL (from .env)
      MYSQL_DATABASE: ${DOCTORS_DB_NAME}           # Database to initialize for doctors
    ports:
      - "3307:3306"  # Map container port 3306 to host port 3307
    container_name: "distributeur-backend-db"  # Container name for doctors DB
    volumes:
      - ./sql/distributeur:/docker-entrypoint-initdb.d:ro  # SQL scripts to initialize doctors DB

  # ----------------------------
  # Test container (optional)
  # ----------------------------
  test:
    build:
      context: .  # Build context for tests
      dockerfile: docker/Dockerfile.test  # Dockerfile for test environment
    image: distributeur-backend-test:latest  # Name of the test image
    command: ["pytest", "--ignore=app.py", "--cov=./", "--cov-report=term-missing", "-vv"]  # Run pytest with coverage
    volumes:
      - .:/app  # Mount source code for test access
    environment:
      - FLASK_ENV=testing
      - APP_DB_HOST=app-backend-db
      - APP_DB_USER=${APP_DB_USER}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD}
      - APP_DB_NAME=${APP_DB_NAME}
    profiles:
      - test  # Only launch if 'test' profile is active
    container_name: "distributeur-backend-test"  # Explicit container name for test container

# ----------------------------
# Docker volumes
# ----------------------------
volumes:
  medicine_data:  # Persisted volume for medicine data
