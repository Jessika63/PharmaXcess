spring.application.name=pharmaxcess_server

spring.datasource.url=jdbc:postgresql://db:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLPostGISDialect
spring.jpa.show-sql=true

server.port=${SERVER_PORT_INTERNAL:8080}
server.address=0.0.0.0

server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=pharmaxcess-ssl

spring.security.user.name=admin
spring.security.user.password=admin1234
spring.security.user.roles=USER
spring.security.enabled=false